services:
  banco:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: feito_a_mao
      POSTGRES_USER: feito_a_mao
      POSTGRES_PASSWORD: feito_a_mao
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feito_a_mao -d feito_a_mao"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dados_postgres:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://feito_a_mao:feito_a_mao@banco:5432/feito_a_mao?schema=public
      JWT_SECRET: desenvolvimento-feito-a-mao-chave-secreta-local
      JWT_EXPIRES_SECONDS: 7200
      AUTH_COOKIE_NAME: feito_a_mao_session
      COOKIE_SECURE: "false"
      ADMIN_NAME: Administrador
      ADMIN_EMAIL: admin@feitoamao.local
      ADMIN_PASSWORD: FeitoAMao@2026
    ports:
      - "3333:3333"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados_postgres:
